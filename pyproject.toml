[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overhead-scanner"
version = "1.0.0"
description = "DIY overhead document scanner -- twin Sony A6000, dual Raspberry Pi 5"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Catalin Muntean"}]
keywords = ["book-scanner", "document-scanner", "photogrammetry", "opencv",
            "camera-calibration", "mtf", "iso12233", "gphoto2", "raspberry-pi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8",
  "scipy>=1.10",
  "Pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/cmtunderbird/overhead-scanner"
Documentation = "https://github.com/cmtunderbird/overhead-scanner/tree/main/docs"
Issues = "https://github.com/cmtunderbird/overhead-scanner/issues"

[project.optional-dependencies]
camera = ["gphoto2>=2.5"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
